[platformio]
default_envs = esp32s3
build_dir = C:\.pio_test

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
    fastled/FastLED @ ^3.9.0
build_unflags = -Wl,-Map="${BUILD_DIR}/firmware.map"
build_flags = 
    -D ESP32S3
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D LED_PIN=1
    -D LED_WIDTH=88
    -D LED_HEIGHT=10
    -D COLOR_ORDER=GRB

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
    fastled/FastLED @ ^3.9.0
build_unflags = -Wl,-Map="${BUILD_DIR}/firmware.map"
build_flags = 
    -D ESP32_GENERIC
    -D CORE_DEBUG_LEVEL=0
    -D LED_PIN=2
    -D LED_WIDTH=88
    -D LED_HEIGHT=10
    -D COLOR_ORDER=GRB
