[platformio]
default_envs = esp32s3
build_dir = C:\.pio_test

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = default.csv
board_build.embed_files = demo/clips.bin
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
    fastled/FastLED @ 3.10.3
build_unflags = -Wl,-Map="${BUILD_DIR}/firmware.map"
build_flags = 
    -D ESP32S3
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D LED_PIN=1
    -D LED_WIDTH=88
    -D LED_HEIGHT=10
    -D COLOR_ORDER=GRB

; Large single-app partitions for embedded demo clips (used by the manager app by flash size)
[env:esp32s3_8mb]
extends = env:esp32s3
board_build.flash_size = 8MB
board_build.partitions = partitions_8MB_demo.csv

[env:esp32s3_4mb]
extends = env:esp32s3
board_build.flash_size = 4MB
board_build.partitions = partitions_4MB_demo.csv

[env:esp32]
platform = espressif32
board = esp32dev
board_build.embed_files = demo/clips.bin
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = 
    fastled/FastLED @ 3.10.3
build_unflags = -Wl,-Map="${BUILD_DIR}/firmware.map"
build_flags = 
    -D ESP32_GENERIC
    -D CORE_DEBUG_LEVEL=0
    -D LED_PIN=2
    -D LED_WIDTH=88
    -D LED_HEIGHT=10
    -D COLOR_ORDER=GRB
